# Every source the pipeline monitors. Adding a source should only need a new entry here.
#
# Fields: see pipeline/src/roundup/models.py (Source). Methods, in order of preference:
#   crossref / openalex  ->  rss  ->  html  ->  none (listed for coverage, not collected)
# Disabled entries are documented gaps or collectors still to be built; docs/SOURCES.md
# explains each one. Endpoints were checked on 2026-10-31.

sources:

  # ── Journals (paywalled: titles and abstracts only) ──────────────────────────
  - id: aer
    name: American Economic Review
    group: journal
    country_or_region: United States
    method: crossref
    issns: ["0002-8282", "1944-7981"]
    fallback: openalex
    paywalled: true
    notes: "Crossref has abstracts for most articles. Records carry the issue date only."

  - id: econometrica
    name: Econometrica
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0012-9682", "1468-0262"]
    fallback: openalex
    paywalled: true
    notes: "Crossref records carry the year only, so collection filters on DOI registration date."

  - id: jpe
    name: Journal of Political Economy
    group: journal
    country_or_region: United States
    method: crossref
    issns: ["0022-3808", "1537-534X"]
    fallback: openalex
    paywalled: true
    notes: "Crossref has no abstracts; OpenAlex fills about a third. Papers without one are logged and skipped."

  - id: qje
    name: Quarterly Journal of Economics
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0033-5533", "1531-4650"]
    fallback: openalex
    paywalled: true

  - id: restud
    name: Review of Economic Studies
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0034-6527", "1467-937X"]
    fallback: openalex
    paywalled: true

  # ── NBER, BPEA, IMF, BIS ────────────────────────────────────────────────────
  - id: nber
    name: NBER Working Papers
    group: nber
    country_or_region: United States
    method: crossref
    doi_prefix: "10.3386"
    fallback: openalex
    feed_urls: ["https://back.nber.org/rss/new.xml"]
    paywalled: true
    notes: "Crossref has dates and authors but no abstracts; OpenAlex supplies them. The RSS feed has abstracts but no dates and only about a week of papers."

  - id: bpea
    name: Brookings Papers on Economic Activity
    group: bpea
    country_or_region: United States
    method: html
    url: https://www.brookings.edu/projects/brookings-papers-on-economic-activity/all-bpea-research/
    enabled: false
    notes: "Unresolved. Crossref only has the JSTOR archive; the paper list is loaded by JavaScript and Brookings' WordPress feeds return no items."

  - id: imf
    name: IMF Working Papers
    group: intl_org
    country_or_region: Global
    method: crossref
    issns: ["1018-5941"]
    fallback: openalex
    notes: "Crossref has abstracts for nearly all papers. The old IMF RSS endpoint now returns 404."

  - id: bis
    name: Bank for International Settlements
    group: intl_org
    country_or_region: Global
    method: rss
    feed_urls: ["https://www.bis.org/doclist/bis_fsi_publs.rss"]
    notes: "'Research papers' feed: working papers, BIS Bulletins and BIS Papers, with summaries."

  # ── G10 central banks ───────────────────────────────────────────────────────
  - id: fed_board
    name: Federal Reserve Board
    group: g10_cb
    country_or_region: United States
    method: rss
    feed_urls:
      - https://www.federalreserve.gov/feeds/feds.xml
      - https://www.federalreserve.gov/feeds/ifdp.xml
      - https://www.federalreserve.gov/feeds/feds_notes.xml
    notes: "FEDS, IFDP and FEDS Notes, all with abstracts."

  - id: boc
    name: Bank of Canada
    group: g10_cb
    country_or_region: Canada
    method: rss
    feed_urls:
      - https://www.bankofcanada.ca/content_type/working-papers/feed/
      - https://www.bankofcanada.ca/content_type/discussion-papers/feed/
      - https://www.bankofcanada.ca/content_type/staff-analytical-notes/feed/

  - id: boe
    name: Bank of England
    group: g10_cb
    country_or_region: United Kingdom
    method: rss
    feed_urls: ["https://www.bankofengland.co.uk/rss/publications"]
    link_pattern: "/(working-paper|macro-technical-paper)/"
    notes: "General publications feed, filtered to staff working papers. Summaries are short."

  - id: boj
    name: Bank of Japan
    group: g10_cb
    country_or_region: Japan
    method: rss
    feed_urls: ["https://www.boj.or.jp/en/rss/whatsnew.xml"]
    link_pattern: "/en/research/"
    notes: "'What's new' feed filtered to research. No summaries, and many links go straight to PDFs."

  - id: snb
    name: Swiss National Bank
    group: g10_cb
    country_or_region: Switzerland
    method: rss
    feed_urls: ["https://www.snb.ch/public/rss/en/papers"]
    notes: "Working Papers, Economic Studies and Economic Notes, with summaries."

  - id: riksbank
    name: Sveriges Riksbank
    group: g10_cb
    country_or_region: Sweden
    method: html
    url: https://www.riksbank.se/en-gb/press-and-published/publications/working-paper-series/
    enabled: false
    notes: "No research feed (only press releases, notices, speeches, minutes, calendar). HTML collector planned."

  - id: bundesbank
    name: Deutsche Bundesbank
    group: g10_cb
    country_or_region: Germany
    method: rss
    feed_urls: ["https://www.bundesbank.de/service/rss/en/633292/feed.rss"]
    notes: "Discussion Papers feed. No summaries, so abstracts must come from each paper's page."

  - id: bdf
    name: Banque de France
    group: g10_cb
    country_or_region: France
    method: html
    url: https://www.banque-france.fr/en/publications-and-research/research-publications
    enabled: false
    notes: "No feed found. The listing page has no paper links in its HTML (likely rendered by JavaScript)."

  - id: bancaditalia
    name: Banca d'Italia
    group: g10_cb
    country_or_region: Italy
    method: html
    url: https://www.bancaditalia.it/pubblicazioni/temi-discussione/index.html?com.dotmarketing.htmlpage.language=1
    enabled: false
    notes: "RSS exists under /util/, which robots.txt disallows. The working-paper listing is allowed (crawl delay 5s). HTML collector planned."

  - id: dnb
    name: De Nederlandsche Bank
    group: g10_cb
    country_or_region: Netherlands
    method: rss
    feed_urls:
      - https://www.dnb.nl/en/rss/16455/4614/Working%20Papers
      - https://www.dnb.nl/en/rss/16455/4614/Occasional%20Studies
    notes: "No summaries, so abstracts must come from each paper's page."

  - id: nbb
    name: National Bank of Belgium
    group: g10_cb
    country_or_region: Belgium
    method: rss
    feed_urls: ["https://www.nbb.be/en/publication_rss.xml"]
    notes: "All-publications feed (working papers, Economic Review, projections). Short summaries."

  - id: ecb
    name: European Central Bank
    group: g10_cb
    country_or_region: Euro area
    method: rss
    feed_urls:
      - https://www.ecb.europa.eu/rss/wppub.html
      - https://www.ecb.europa.eu/rss/rbu.html
    notes: "Working Papers (with abstracts) and the Research Bulletin."

  # ── Federal Reserve regional banks (via Fed in Print) ───────────────────────
  # Fed in Print is the Federal Reserve System's own research database. It has one
  # feed per bank, with abstracts, so every regional bank uses the same collector.
  - id: boston_fed
    name: Federal Reserve Bank of Boston
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.bostonfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/boston.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print. The bank's own research feed stopped in 2020."

  - id: ny_fed
    name: Federal Reserve Bank of New York
    group: fed_regional
    country_or_region: United States
