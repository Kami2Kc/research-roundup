# Every source the pipeline monitors. Adding a source should only need a new entry here.
#
# Fields: see pipeline/src/roundup/models.py (Source). Methods, in order of preference:
#   crossref / openalex  ->  rss  ->  html  ->  none (listed for coverage, not collected)
# Disabled entries are documented gaps or collectors still to be built; docs/SOURCES.md
# explains each one. Endpoints were checked on 2026-10-31.

sources:

  # ── Journals (paywalled: titles and abstracts only) ──────────────────────────
  - id: aer
    name: American Economic Review
    group: journal
    country_or_region: United States
    method: crossref
    issns: ["0002-8282", "1944-7981"]
    fallback: openalex
    paywalled: true
    notes: "Crossref has abstracts for most articles. Records carry the issue date only."

  - id: econometrica
    name: Econometrica
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0012-9682", "1468-0262"]
    fallback: openalex
    paywalled: true
    notes: "Crossref records carry the year only, so collection filters on DOI registration date."

  - id: jpe
    name: Journal of Political Economy
    group: journal
    country_or_region: United States
    method: crossref
    issns: ["0022-3808", "1537-534X"]
    fallback: openalex
    paywalled: true
    notes: "Partial. Crossref has no JPE abstracts and OpenAlex has few for recent papers, so most are logged and skipped (and re-checked later)."

  - id: qje
    name: Quarterly Journal of Economics
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0033-5533", "1531-4650"]
    fallback: openalex
    paywalled: true

  - id: restud
    name: Review of Economic Studies
    group: journal
    country_or_region: International
    method: crossref
    issns: ["0034-6527", "1467-937X"]
    fallback: openalex
    paywalled: true

  # ── NBER, BPEA, IMF, BIS ────────────────────────────────────────────────────
  - id: nber
    name: NBER Working Papers
    group: nber
    country_or_region: United States
    method: crossref
    doi_prefix: "10.3386"
    fallback: openalex
    feed_urls: ["https://back.nber.org/rss/new.xml"]
    paywalled: true
    notes: "Crossref has dates and authors but no abstracts; OpenAlex supplies them. The RSS feed has abstracts but no dates and only about a week of papers."

  - id: bpea
    name: Brookings Papers on Economic Activity
    group: bpea
    country_or_region: United States
    method: html
    url: https://www.brookings.edu/projects/brookings-papers-on-economic-activity/
    selectors:
      item: "div.bpea-best-item"
      title: "p.bpea-best-title"
      authors: "p.bpea-best-conference"
      abstract: "section#content div.byo-block.-narrow"
    notes: "Partial. Crossref only has the JSTOR archive and the full paper list is rendered by JavaScript, so we read the 'New and Noteworthy' papers on the BPEA page. They carry no dates, so papers are dated when first seen (the current edition was already listed on our first run and stays undated). Abstracts are Brookings' summary of each paper."

  - id: imf
    name: IMF Working Papers
    group: intl_org
    country_or_region: Global
    method: crossref
    issns: ["1018-5941"]
    fallback: openalex
    notes: "Crossref has abstracts for nearly all papers. The old IMF RSS endpoint now returns 404."

  - id: bis
    name: Bank for International Settlements
    group: intl_org
    country_or_region: Global
    method: rss
    feed_urls: ["https://www.bis.org/doclist/bis_fsi_publs.rss"]
    notes: "'Research papers' feed: working papers, BIS Bulletins and BIS Papers, with summaries."

  # ── G10 central banks ───────────────────────────────────────────────────────
  - id: fed_board
    name: Federal Reserve Board
    group: g10_cb
    country_or_region: United States
    method: rss
    feed_urls:
      - https://www.federalreserve.gov/feeds/feds.xml
      - https://www.federalreserve.gov/feeds/ifdp.xml
      - https://www.federalreserve.gov/feeds/feds_notes.xml
    title_strip: "^(FEDS Paper|IFDP Paper|FEDS Note):\\s*"
    notes: "FEDS, IFDP and FEDS Notes, all with abstracts."

  - id: boc
    name: Bank of Canada
    group: g10_cb
    country_or_region: Canada
    method: rss
    feed_urls:
      - https://www.bankofcanada.ca/content_type/working-papers/feed/
      - https://www.bankofcanada.ca/content_type/discussion-papers/feed/
      - https://www.bankofcanada.ca/content_type/staff-analytical-notes/feed/

  - id: boe
    name: Bank of England
    group: g10_cb
    country_or_region: United Kingdom
    method: rss
    feed_urls: ["https://www.bankofengland.co.uk/rss/publications"]
    link_pattern: "/(working-paper|macro-technical-paper)/"
    selectors:
      abstract: "div.page-content > p"
    notes: "General publications feed, filtered to staff working papers. Its summaries are teasers, so abstracts come from each paper's page."

  - id: boj
    name: Bank of Japan
    group: g10_cb
    country_or_region: Japan
    method: html
    url: https://www.boj.or.jp/en/research/rs_all_{year}/index.htm
    link_pattern: "/research/wps_rev/"
    selectors:
      item: "tbody tr"
      title: "td a"
      date: "td"
      abstract: "main#contents div.outline > p"
    notes: "The year's list of reports and research papers, filtered to Working Papers and the BoJ Review. (The 'What's new' feed is mostly data releases and carries no summaries.)"

  - id: snb
    name: Swiss National Bank
    group: g10_cb
    country_or_region: Switzerland
    method: rss
    feed_urls: ["https://www.snb.ch/public/rss/en/papers"]
    notes: "Working Papers, Economic Studies and Economic Notes, with summaries."

  - id: riksbank
    name: Sveriges Riksbank
    group: g10_cb
    country_or_region: Sweden
    method: html
    url: https://www.riksbank.se/en-gb/press-and-published/publications/working-paper-series/
    selectors:
      item: "div.listing-block__body li"
      title: ".header--file__title"
      link: "a"
      date: ".label"
    title_strip: "^No\\.\\s*\\d+\\s+"
    notes: "No research feed. The working-paper listing links straight to PDFs, so we get titles and dates but no abstracts: papers are logged and skipped."

  - id: bundesbank
    name: Deutsche Bundesbank
    group: g10_cb
    country_or_region: Germany
    method: rss
    feed_urls: ["https://www.bundesbank.de/service/rss/en/633292/feed.rss"]
    selectors:
      abstract: "main div.richtext"
    title_strip: "\\s*\\|.*$"  # the feed appends " | author names"
    notes: "Discussion Papers feed. No summaries, so the abstract (a non-technical summary) comes from each paper's page."

  - id: bdf
    name: Banque de France
    group: g10_cb
    country_or_region: France
    method: html
    url: https://www.banque-france.fr/en/publications-and-research/our-main-publications/working-papers
    selectors:
      item: "a.card.card-vertical"
      title: "h3.card-title"
      date: "small"
      abstract: "div.hero-text div.text-formatted"
    notes: "No feed. Working-paper listing page (the general research page is rendered by JavaScript); abstracts from each paper's page."

  - id: bancaditalia
    name: Banca d'Italia
    group: g10_cb
    country_or_region: Italy
    method: html
    url: https://www.bancaditalia.it/pubblicazioni/temi-discussione/index.html?com.dotmarketing.htmlpage.language=1
    selectors:
      item: "div.bdi-ultime-pubblicazioni li"
      title: "a.bdi-ultime-pubblicazioni-title"
      date: ".bdi-ultime-pubblicazioni-date"
      authors: ".bdi-ultime-pubblicazioni-first"
      abstract: "div.bdi-main-column div.bdi-typography"
    title_strip: "^No\\.\\s*\\d+\\s*-\\s*"
    notes: "RSS exists under /util/, which robots.txt disallows, so we use the working-paper listing (latest six; crawl delay 5s honoured). Abstracts from each paper's page."

  - id: dnb
    name: De Nederlandsche Bank
    group: g10_cb
    country_or_region: Netherlands
    method: rss
    feed_urls:
      - https://www.dnb.nl/en/rss/16455/4614/Working%20Papers
      - https://www.dnb.nl/en/rss/16455/4614/Occasional%20Studies
    selectors:
      abstract: "#rs-content div.component > p"
    notes: "No summaries in the feed, so abstracts come from each paper's page."

  - id: nbb
    name: National Bank of Belgium
    group: g10_cb
    country_or_region: Belgium
    method: rss
    feed_urls: ["https://www.nbb.be/en/publication_rss.xml"]
    selectors:
      abstract: "div.node-publication-full-top__intro"
    notes: "All-publications feed (working papers, Economic Review, projections). Short summaries, replaced by the intro on each paper's page."

  - id: ecb
    name: European Central Bank
    group: g10_cb
    country_or_region: Euro area
    method: rss
    feed_urls:
      - https://www.ecb.europa.eu/rss/wppub.html
      - https://www.ecb.europa.eu/rss/rbu.html
    notes: "Working Papers (with abstracts) and the Research Bulletin."

  # ── Federal Reserve regional banks (via Fed in Print) ───────────────────────
  # Fed in Print is the Federal Reserve System's own research database. It has one
  # feed per bank, with abstracts, so every regional bank uses the same collector.
  - id: boston_fed
    name: Federal Reserve Bank of Boston
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.bostonfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/boston.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print. The bank's own research feed stopped in 2020."

  - id: ny_fed
    name: Federal Reserve Bank of New York
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.newyorkfed.org/research
    feed_urls: ["https://www.fedinprint.org/rss/newyork.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print (Staff Reports, Liberty Street Economics)."

  - id: philly_fed
    name: Federal Reserve Bank of Philadelphia
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.philadelphiafed.org/
    feed_urls: ["https://www.fedinprint.org/rss/philadelphia.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: cleveland_fed
    name: Federal Reserve Bank of Cleveland
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.clevelandfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/cleveland.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: richmond_fed
    name: Federal Reserve Bank of Richmond
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.richmondfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/richmond.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: atlanta_fed
    name: Federal Reserve Bank of Atlanta
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.atlantafed.org/
    feed_urls: ["https://www.fedinprint.org/rss/atlanta.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print. The bank's own working-paper feed (atlantafed.org/rss/wps) also works."

  - id: chicago_fed
    name: Federal Reserve Bank of Chicago
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.chicagofed.org/
    feed_urls: ["https://www.fedinprint.org/rss/chicago.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: stlouis_fed
    name: Federal Reserve Bank of St. Louis
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.stlouisfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/stlouis.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: minneapolis_fed
    name: Federal Reserve Bank of Minneapolis
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.minneapolisfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/minneapolis.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: kc_fed
    name: Federal Reserve Bank of Kansas City
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.kansascityfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/kansascity.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: dallas_fed
    name: Federal Reserve Bank of Dallas
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.dallasfed.org/
    feed_urls: ["https://www.fedinprint.org/rss/dallas.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  - id: sf_fed
    name: Federal Reserve Bank of San Francisco
    group: fed_regional
    country_or_region: United States
    method: rss
    url: https://www.frbsf.org/
    feed_urls: ["https://www.fedinprint.org/rss/sanfrancisco.rss"]
    exclude_pattern: "(?i)speech|remarks|testimony"
    notes: "Via Fed in Print."

  # ── European national central banks: first priority ─────────────────────────
  - id: bde
    name: Banco de España
    group: european_ncb
    country_or_region: Spain
    method: rss
    feed_urls: ["https://www.bde.es/wbe/en/inicio/rss/rss-estudios-publicaciones/"]
    link_pattern: "/(documentos-trabajo|documentos-ocasionales)/"
    selectors:
      abstract: "div.block-entry-content--detail-content > p"
    title_strip: "^(Working|Occasional) Papers\\.\\s*"
    notes: "Publications feed filtered to Working and Occasional Papers. Feed summaries are teasers, so abstracts come from each paper's page."

  - id: bof
    name: Bank of Finland
    group: european_ncb
    country_or_region: Finland
    method: none
    url: https://www.suomenpankki.fi/en/publications/research-publications/discussion-papers/
    enabled: false
    notes: "Not covered. Discussion Papers are listed only in the Bank's DSpace repository (publications.bof.fi), which sits behind Cloudflare and returns 403 to our identified crawler; its content signals also do not grant AI use. Not in OpenAlex."

  - id: bofit
    name: Bank of Finland Institute for Emerging Economies (BOFIT)
    group: european_ncb
    country_or_region: Finland (covers emerging economies)
    method: none
    url: https://www.bofit.fi/en/publications/discussion-papers/
    enabled: false
    notes: "Not covered, for the same reason as the Bank of Finland: the listing is rendered by JavaScript from publications.bof.fi, which returns 403 to our crawler. Not in OpenAlex."

  - id: oenb
    name: Oesterreichische Nationalbank
    group: european_ncb
    country_or_region: Austria
    method: none
    enabled: false
    notes: "Not covered. No feed, and we could not locate a server-rendered working-paper listing on oenb.at."

  - id: cbi
    name: Central Bank of Ireland
    group: european_ncb
    country_or_region: Ireland
    method: none
    url: https://www.centralbank.ie/publication/research-publications/research-technical-papers
    enabled: false
    notes: "Not covered. No feed, and the Research Technical Papers listing is rendered by JavaScript."

  - id: bportugal
    name: Banco de Portugal
    group: european_ncb
    country_or_region: Portugal
    method: none
    enabled: false
    notes: "Not covered. The site returns 403 to our identified crawler; we do not try to get around it."

  - id: norges_bank
    name: Norges Bank
    group: european_ncb
    country_or_region: Norway
    method: rss
    feed_urls:
      - https://www.norges-bank.no/en/rss-feeds/Working-papers---Norges-Bank/
      - https://www.norges-bank.no/en/rss-feeds/Staff-Memo---Norges-Bank/
    selectors:
      abstract: "div.publication-start__body"
    notes: "No summaries in the feeds, so abstracts come from each paper's page."

  - id: nationalbanken
    name: Danmarks Nationalbank
    group: european_ncb
    country_or_region: Denmark
    method: none
    url: https://www.nationalbanken.dk/en/news-and-knowledge/publications-and-speeches
    enabled: false
    notes: "Not covered. No feed, and the publications list (including working papers) is rendered by JavaScript."

  - id: nbp
    name: Narodowy Bank Polski
    group: european_ncb
    country_or_region: Poland
    method: none
    enabled: false
    notes: "Not covered. The site returns 403 to our identified crawler; we do not try to get around it."

  - id: cnb
    name: Czech National Bank
    group: european_ncb
    country_or_region: Czechia
    method: none
    url: https://www.cnb.cz/en/economic-research/research-publications/cnb-working-paper-series/
    enabled: false
    notes: "Not covered. Feeds cover only press releases and the cnBlog, and the working-paper series page is rendered by JavaScript."

  - id: mnb
    name: Magyar Nemzeti Bank
    group: european_ncb
    country_or_region: Hungary
    method: html
    url: https://www.mnb.hu/en/publications/studies-publications-statistics/working-papers-1-1
    selectors:
      item: "a.cb-file"
      abstract: "div.c-txt div.text.embed"
    notes: "Working-paper listing with abstracts on each paper's page. The site shows no publication dates, so papers are dated when we first see them (the existing back catalogue stays undated)."

  # ── European national central banks: rest of the euro area ──────────────────
  # Covered only where there is a feed or a simple page (about 15 minutes per scraper).
  - id: bank_of_greece
    name: Bank of Greece
    group: european_ncb
    country_or_region: Greece
    method: none
    enabled: false
    notes: "Not covered. The site returns 403 to our identified crawler; we do not try to get around it."

  - id: nbs
    name: Národná banka Slovenska
    group: european_ncb
    country_or_region: Slovakia
    method: none
    url: https://nbs.sk/en/publications/research-papers-working-and-occasional-papers-wp-op/
    enabled: false
    notes: "Not covered. The listing shows abstracts inline but has no publication dates and no per-paper pages, so papers cannot be identified or placed in a month reliably."

  - id: bsi
    name: Banka Slovenije
    group: european_ncb
    country_or_region: Slovenia
    method: none
    url: https://www.bsi.si/en/blog-and-research-publications
    enabled: false
    notes: "Not covered. The page mixes blog posts with research and has no simple research listing."

  - id: lb
    name: Lietuvos bankas
    group: european_ncb
    country_or_region: Lithuania
    method: none
    enabled: false
    notes: "Not covered. The site returns 403 to our identified crawler; we do not try to get around it."

  - id: latvijas_banka
    name: Latvijas Banka
    group: european_ncb
    country_or_region: Latvia
    method: none
    url: https://www.bank.lv/en/news-and-events/working-papers/2026
    enabled: false
    notes: "Not covered. No feed, and the yearly listing pages have no paper links in their HTML."

  - id: eesti_pank
    name: Eesti Pank
    group: european_ncb
    country_or_region: Estonia
    method: none
    url: https://www.eestipank.ee/en/publications/working-papers
    enabled: false
    notes: "Not covered. The listing is a JavaScript app; its data is embedded as JSON, which would need a custom parser."

  - id: bcl
    name: Banque centrale du Luxembourg
    group: european_ncb
    country_or_region: Luxembourg
    method: none
    url: https://www.bcl.lu/en/publications/Working-papers/index.html
    enabled: false
    notes: "Not covered. The only feed carries press releases, and the working-paper listing is not in the page HTML."

  - id: cbm
    name: Central Bank of Malta
    group: european_ncb
    country_or_region: Malta
    method: none
    url: https://www.centralbankmalta.org/en/all-pubs-res
    enabled: false
    notes: "Not covered. The listing links straight to PDFs with no abstracts, so every paper would be skipped."

  - id: cbc
    name: Central Bank of Cyprus
    group: european_ncb
    country_or_region: Cyprus
    method: none
    enabled: false
    notes: "Not covered. No feed and no paper links on the publications page."

  - id: hnb
    name: Hrvatska narodna banka
    group: european_ncb
    country_or_region: Croatia
    method: html
    url: https://www.hnb.hr/en/analyses-and-publications/occasional-publications/working-papers
    selectors:
      item: "div.entry-container"
      title: "h4.title a"
      date: "tr:nth-of-type(2) td"
      authors: "tr:nth-of-type(4) td"
      abstract: "article.module-publication-details > div"
    notes: "Working-paper listing (dates are month only) with abstracts on each paper's page."

  - id: bnb
    name: Bulgarian National Bank
    group: european_ncb
    country_or_region: Bulgaria
    method: none
    enabled: false
    notes: "Not covered. Its feeds cover press-office categories in Bulgarian only, and no research listing is in the page HTML."
