name: Weekly collect and screen

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roundup-pipeline # shared with the monthly workflow, so the two never run at once
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_SCREEN_MODEL: ${{ vars.LLM_SCREEN_MODEL || 'claude-haiku-5-5' }}
      LLM_EDITOR_MODEL: ${{ vars.LLM_EDITOR_MODEL || 'claude-sonnet-5-5' }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
    steps:
      # Actions are pinned to a commit (tags can be moved); the comment gives the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: pipeline

      - name: Collect, screen and export
        working-directory: pipeline
        run: uv run --frozen roundup run-weekly

      - name: Commit the updated database and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roundup.db web/public
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "data: weekly run $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Trigger a Vercel deployment (if a deploy hook is configured)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Deployment triggered."; fi
